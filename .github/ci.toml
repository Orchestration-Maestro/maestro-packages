wasm_crates = ["maestro-extension-examples", "maestro-prompt-suffix"]
browser_build = true
browser_test_crates = ["maestro-web-example"]
test_tools = true
test_prepare = "cargo install --quiet --locked --git https://github.com/Orchestration-Maestro/maestro --rev b5b1f350af56b76c97290dd0a40959e33f6174c5 maestro-tooling --bin development --root target/development && target/development/bin/development prepare-test-setup prepare \"$TEST_PREPARE_OUTPUT\" \"${CARGO_TARGET_DIR:-target/test-prepare}\""
test_prepare_setups = ["author-component", "cargo-checks", "executable", "native-fixture"]
test_prepare_inputs = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".config/nextest.toml", "examples/**", "crates/**"]
test_inputs = { "examples/" = ["maestro-extension-examples", "maestro-sdk-examples"] }
reserved_ports = []
# Nmap's -Pn flag and the parser term unparseable are intentional.
spelling_words = ["temH", "Pn", "unparseable"]
check_targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
advisory_exceptions = [
  { id = "RUSTSEC-2025-0141", package = "bincode", version = "1.3.3", reason = "syntect's packaged syntax and theme dumps, through Maestro's application crates; owner-approved in Maestro" },
  { id = "RUSTSEC-2025-0141", package = "bincode", version = "2.0.1", reason = "Maestro's daemon protocol encoding, through its application crates; owner-approved in Maestro despite unmaintained status" },
  { id = "RUSTSEC-2026-0387", package = "crypto-bigint", version = "0.5.5", reason = "aws-config credentials-login (Bedrock login profiles) signs with p256 0.13; no patched 0.5.x and aws-config 1.13.0 still requires p256 0.13; remove when aws-config moves to p256 0.14" },
  { id = "RUSTSEC-2026-0391", package = "zstd", version = "0.13.3", reason = "Wasmtime's cache only calls encode_all and decode_all, never the affected with_context stream constructors; remove when wasmtime moves to zstd ≥ 0.14.3" },
  { id = "RUSTSEC-2026-0398", package = "zstd-safe", version = "7.3.0", reason = "Wasmtime disables zstd default features and no other dependency enables seekable, so Seekable::decompress is unavailable; remove when wasmtime moves to zstd ≥ 0.14.3" },
  { id = "RUSTSEC-2026-0403", package = "zstd-safe", version = "7.3.0", reason = "Wasmtime disables zstd default features and no other dependency enables legacy, so the affected legacy-frame decompression is unavailable; remove when wasmtime moves to zstd ≥ 0.14.3" },
  { id = "RUSTSEC-2026-0410", package = "zstd-sys", version = "2.1.0+zstd.1.5.7", reason = "The Wasmtime host is built only for native targets, so zstd-sys's affected wasm32 allocator shim is never compiled; remove when wasmtime moves to zstd ≥ 0.14.3" },
]
license_exceptions = []
git_sources = ["https://github.com/Orchestration-Maestro/maestro", "https://github.com/bytecodealliance/wasmtime", "https://github.com/FrancoisLDaigneault/room4doom", "https://github.com/not-fl3/nanoserde"]
