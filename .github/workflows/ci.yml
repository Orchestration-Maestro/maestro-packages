name: CI
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/ci.yml@4a05e4c4c6cb82451af0b585255881bb7d860c81 # v2.5.1
    permissions:
      contents: read
    with:
      working-directory: .
      rust-version: '1.98.0'
      coverage-threshold: 90
      license-policy: auto
  sarif:
    needs: rust
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/upload-sarif.yml@4a05e4c4c6cb82451af0b585255881bb7d860c81 # v2.5.1
    permissions:
      contents: read
      security-events: write
    with:
      artifact-name: ${{ needs.rust.outputs.artifact-name }}
  coverage:
    needs: rust
    uses: Orchestration-Maestro/rust-workflows/.github/workflows/upload-coverage.yml@4a05e4c4c6cb82451af0b585255881bb7d860c81 # v2.5.1
    permissions:
      contents: read
      id-token: write
    with:
      artifact-name: ${{ needs.rust.outputs.artifact-name }}
