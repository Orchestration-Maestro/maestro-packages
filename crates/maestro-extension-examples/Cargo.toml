[dependencies]
maestro-extensions-wasm.workspace = true
maestro-listing.workspace = true

[dev-dependencies]
chrono.workspace = true
httpdate.workspace = true
indexmap.workspace = true
maestro-json.workspace = true
num-traits.workspace = true
regex.workspace = true
ryu-js.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wit-bindgen = { workspace = true, features = ["async-spawn"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro.workspace = true
maestro-app.workspace = true
maestro-catalog.workspace = true
maestro-chat.workspace = true
maestro-credentials.workspace = true
maestro-extensions = { workspace = true, features = ["test-support"] }
maestro-extensions-wasmtime = { workspace = true, features = ["test-support"] }
maestro-lock.workspace = true
maestro-markdown = { workspace = true, features = ["test-support"] }
maestro-models.workspace = true
maestro-path.workspace = true
maestro-session.workspace = true
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
maestro-theme = { workspace = true, features = ["test-support"] }
maestro-tui = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
