[package]
name = "maestro-sdk-examples"
version = "0.1.0"
edition.workspace = true
autotests = false
license.workspace = true
repository.workspace = true
description = "Builds and verifies Maestro's SDK examples and RPC clients."

[dev-dependencies]
base64.workspace = true
maestro-agent.workspace = true
maestro-app.workspace = true
maestro-credentials.workspace = true
maestro-extensions.workspace = true
maestro-models.workspace = true
maestro-path.workspace = true
maestro-resources.workspace = true
maestro-settings.workspace = true
maestro-test-directory.workspace = true
maestro-test-process.workspace = true
maestro-theme.workspace = true
maestro-tools.workspace = true
maestro-tui = { workspace = true, features = ["test-support"] }
maestro-tui-crossterm.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "process"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "rpc_extension_ui"
path = "../../examples/rpc_extension_ui.rs"
test = true

