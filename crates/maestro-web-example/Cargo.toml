[package]
autotests = false
name = "maestro-web-example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Builds the browser chat example and runs its browser tests in Chromium."

[[example]]
name = "chat"
crate-type = ["cdylib"]
path = "../../examples/web/chat.rs"

[[example]]
name = "browser_exports"
crate-type = ["cdylib"]
path = "tests/program/lib.rs"

[[example]]
name = "prepare_browser_exports"
path = "tests/prepare.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
maestro-app.workspace = true
maestro-theme.workspace = true
maestro-web.workspace = true
serde.workspace = true
serde_json.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
maestro-test-browser.workspace = true
maestro-test-directory.workspace = true
maestro-tooling.workspace = true

[lints]
workspace = true
