[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Orchestration-Maestro/maestro-packages"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
indexmap = "=2.14.2"
maestro-agent = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-app = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-credentials = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-extensions = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-extensions-wasm = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-models = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-path = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-resources = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-settings = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-test-directory = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-test-extension-host = { path = "crates/maestro-test-extension-host" }
maestro-test-process = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-theme = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-tools = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-tui = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
maestro-tui-crossterm = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "1a57f478148aa8b88a52a265b6f02aa467bc8d0f" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "=1.53.3", features = ["rt", "macros", "net", "io-util", "io-std", "time", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
socket2 = { version = "=0.6.5", default-features = false, features = ["all"] }

[workspace.lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[workspace.lints.clippy]
pedantic = { level = "forbid", priority = -1 }
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "forbid"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
module_name_repetitions = "forbid"
