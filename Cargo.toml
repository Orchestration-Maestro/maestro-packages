[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Orchestration-Maestro/maestro-packages"

[workspace.dependencies]
indexmap = "=2.14.2"
js-sys = "=0.3.106"
maestro-app = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-extensions-wasm = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-test-browser = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-test-directory = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-test-extension-host = { path = "crates/maestro-test-extension-host" }
maestro-test-process = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-theme = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-tooling = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
maestro-web = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ac4b8926090b5fcf41e33433b8456720bd3569e" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "=1.53.3", features = ["rt", "macros", "net", "io-util", "io-std", "time", "signal"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
socket2 = { version = "=0.6.5", default-features = false, features = ["all"] }

[workspace.lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[workspace.lints.clippy]
pedantic = { level = "forbid", priority = -1 }
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "forbid"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
module_name_repetitions = "forbid"
