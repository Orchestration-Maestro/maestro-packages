[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Orchestration-Maestro/maestro-packages"

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
httpdate = "=1.0.3"
indexmap = "=2.14.2"
js-sys = "=0.3.106"
maestro = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-agent = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-app = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-catalog = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-chat = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-credentials = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-extensions = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-extensions-wasm = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-extensions-wasmtime = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-json = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-listing = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-lock = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-markdown = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-models = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-path = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-resources = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-session = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-settings = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-test-browser = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-test-directory = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-test-extension-host = { path = "crates/maestro-test-extension-host" }
maestro-test-process = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-theme = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-tooling = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-tools = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-tui = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-tui-crossterm = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
maestro-web = { git = "https://github.com/Orchestration-Maestro/maestro", rev = "5ada20b86f94821d6b7edd8c07030c554b04319d" }
num-traits = "=0.2.19"
regex = "=1.13.1"
ryu-js = "=1.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "=1.53.3", features = ["rt", "macros", "net", "io-util", "io-std", "time", "signal"] }
toml = "=1.1.6"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
socket2 = { version = "=0.6.5", default-features = false, features = ["all"] }
wit-bindgen = { version = "=0.62.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
forbidden_lint_groups = "forbid"

[workspace.lints.clippy]
pedantic = { level = "forbid", priority = -1 }
missing_docs_in_private_items = "forbid"
redundant_clone = "forbid"
too_many_arguments = "forbid"
fn_params_excessive_bools = "forbid"
too_many_lines = "forbid"
cognitive_complexity = "forbid"
excessive_nesting = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
module_name_repetitions = "forbid"

# Tests compile extension components; an unoptimised code generator makes each compile about five times slower.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3
